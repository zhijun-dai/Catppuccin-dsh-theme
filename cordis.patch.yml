# dsh-catppuccin profile patch layer — insert one loader entry for the plugin
# package. The entry is a normal cordis loader entry (id + package name); the
# browser half is picked up by dsh-client-modules through the package's
# dsh.client declaration, exactly like the shipped ui-* packages.
- insert:
    - id: catppuccin
      name: 'dsh-catppuccin'
    # dsh-TUI theme sync: idempotently copies the four Catppuccin theme
    # JSONs into ~/.dsh-tui/themes/ on activation. No inject, so it activates
    # in EVERY profile — in a dsh-tui profile this is what makes the
    # one-command install work (dsh-TUI reads themes only from that
    # directory); in a web/desktop profile it keeps themes in sync for users
    # who also run dsh-TUI; with no ~/.dsh-tui on disk it is a strict no-op.
    - id: dsh-catppuccin-tui-themes
      name: 'dsh-catppuccin/tui-themes'
